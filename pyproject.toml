[project]
name = "holo-api"
version = "0.1.0"
description = "Backend del proyecto Holo (FastAPI)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI usa Depends() y Header() como valores por defecto.
ignore = ["B008"]
